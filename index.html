<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Turnout | Modern Event Platform</title>
    <meta
      name="description"
      content="Turnout is a modern event platform for creating stunning event pages, selling tickets, and managing attendees with ease."
    />
    <link rel="icon" type="image/svg+xml" href="/turnout-favicon.svg" />
    <script>
      (function () {
        var host = (location.hostname || '').toLowerCase();
        var platform =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === 'app.bigturnout.co' ||
          host === 'bigturnout.co' ||
          host === 'www.bigturnout.co' ||
          host === 'domains.bigturnout.co' ||
          host.slice(-11) === '.vercel.app';
        if (platform) return;
        // Custom event domains: no Turnout chrome in the initial document.
        document.title = '';
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.setAttribute('href', 'data:,');
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', '');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
